# ============================================================================
# Configuration for: A Multimodal Bi-LSTM-ResNet-50 Framework with
# Reliability-Gated Fusion for Detecting Machine-Generated Restaurant Reviews
#
# NOTE: paths under `data:` are placeholders. Run `src/dataset_audit.py`
# first against your actual data folder -- it will tell you the real
# column names / paths to put here. Do NOT assume the fields below are
# correct until the audit confirms them.
# ============================================================================

project_name: "aigen_foodreview_gated_fusion"

# ----------------------------------------------------------------------------
# DATA
# ----------------------------------------------------------------------------
data:
  root_dir: "data"                     # root folder containing csv(s) + images
  train_csv: "data/train.csv"          # placeholder -- confirm via dataset_audit.py
  val_csv: "data/val.csv"
  test_csv: "data/test.csv"
  image_dir: "data/images"
  # Column names are NOT assumed. dataset_audit.py inspects the real CSV
  # and writes results/dataset_audit.json with the detected column mapping.
  # Once confirmed, fill these in explicitly (do not leave to autodetection
  # for the final run):
  columns:
    id_col: null            # e.g. "id"  -- set after running dataset_audit.py on the REAL data/ contents
    text_col: null          # e.g. "review_text"
    image_col: null         # e.g. "image_path" or "image_id"
    label_col: null         # e.g. "label"  (0=authentic, 1=machine-generated)
    restaurant_col: null    # optional, for grouped-split sensitivity checks
  # NOTE: a small synthetic pipeline-smoke-test fixture (NOT real AiGen-FoodReview
  # data) lives under tests/fixtures/ with confirmed columns id/review_text/
  # image_path/label -- see tests/README.md and tests/run_smoke_test.sh.

# ----------------------------------------------------------------------------
# TEXT PREPROCESSING / TOKENIZER
# ----------------------------------------------------------------------------
text:
  lowercase: true
  max_seq_len: 256
  min_token_freq: 1          # tokens rarer than this in TRAIN become <unk>
  vocab_size_cap: null       # null = no cap; else keep top-N most frequent
  embedding_dim: 128

# ----------------------------------------------------------------------------
# IMAGE PREPROCESSING
# ----------------------------------------------------------------------------
image:
  resize: 224
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]

# ----------------------------------------------------------------------------
# MODEL ARCHITECTURE
# ----------------------------------------------------------------------------
model:
  common_dim: 256            # shared representation dimension for F_T and F_I
  text:
    embedding_dim: 128
    lstm_hidden: 128          # per direction -> 256 bidirectional
    lstm_layers: 1
    bidirectional: true
    pooling: "masked_mean"    # masked mean pooling over Bi-LSTM outputs
  image:
    backbone: "resnet50"
    pretrained: true
    freeze_backbone: true     # PRIMARY experiment: frozen backbone
    unfreeze_last_block: false  # SECONDARY experiment: set true to fine-tune layer4 only
  fusion:
    type: "gated"              # one of: text_only | image_only | concat | gated
  classifier:
    hidden_dim: 128            # 256 -> 128 -> 1
    dropout: 0.4
    activation: "relu"

# ----------------------------------------------------------------------------
# TRAINING
# ----------------------------------------------------------------------------
train:
  batch_size: 32
  max_epochs: 30
  early_stopping_patience: 5
  early_stopping_metric: "val_f1"   # model selection metric (VALIDATION ONLY)
  optimizer: "adamw"
  lr_new_layers: 1.0e-3              # embedding, LSTM, projections, gate, classifier
  lr_finetune_layers: 1.0e-5         # ResNet last block, only when unfreeze_last_block=true
  weight_decay: 1.0e-5
  lr_scheduler: "reduce_on_plateau"  # monitors val_f1
  lr_scheduler_patience: 2
  lr_scheduler_factor: 0.5
  grad_clip_norm: 5.0
  mixed_precision: true              # only actually used when CUDA is available
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

# ----------------------------------------------------------------------------
# THRESHOLDING
# ----------------------------------------------------------------------------
threshold:
  default: 0.5
  select_on: "validation"    # NEVER "test"
  selection_metric: "f1"     # threshold maximizing this metric on validation

# ----------------------------------------------------------------------------
# SEEDS
# ----------------------------------------------------------------------------
seeds: [42, 123, 2024]

# ----------------------------------------------------------------------------
# HYPERPARAMETER SEARCH SPACE (train+val only, test untouched)
# ----------------------------------------------------------------------------
hparam_search:
  method: "grid"          # "grid" or "optuna"
  n_trials_optuna: 20     # only used if method == optuna
  embedding_dim: [64, 128, 256]
  lstm_hidden: [64, 128, 256]
  dropout: [0.3, 0.4, 0.5]
  lr_new_layers: [1.0e-3, 5.0e-4]
  lr_finetune_layers: [1.0e-5, 1.0e-4]
  selection_metric: "val_f1"
  output_file: "results/best_hparams.json"

# ----------------------------------------------------------------------------
# ROBUSTNESS EXPERIMENTS
# ----------------------------------------------------------------------------
robustness:
  image_removal: true
  image_degradation:
    jpeg_quality_levels: [30, 10]
    gaussian_blur_radius: [2, 5]
  text_perturbation:
    typo_rate: [0.05, 0.15]
    word_dropout_rate: [0.1, 0.3]
  generator_separated_eval: false   # set true only if generator-source metadata exists

# ----------------------------------------------------------------------------
# MISC
# ----------------------------------------------------------------------------
paths:
  checkpoints_dir: "checkpoints"
  results_dir: "results"
  plots_dir: "plots"
  logs_dir: "logs"
  vocab_path: "results/vocab.json"

logging:
  log_level: "INFO"
